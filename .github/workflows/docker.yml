# Builds the Agentic server's Docker image, checks that it starts and answers, and publishes it to GitHub Packages:
# ghcr.io/<owner>/agentic with the tags latest, the project's version (src/Agentic/Agentic.vbproj) and sha-<commit>.
name: Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentic

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Agentic/Agentic.vbproj)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentic:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start and check the server
        run: |
          docker run -d --name agentic-test -p 8080:8080 \
            -e AGENTIC_AIProviders__OpenWebUI__BaseUrl=http://127.0.0.1:9/api \
            -e AGENTIC_AIProviders__OpenWebUI__ApiKey=smoke-test \
            -e AGENTIC_LocalModels__Enabled=false \
            agentic:test
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then ok=1; echo "healthy after $((i * 2)) s"; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' agentic-test)" != "true" ]; then echo "the container stopped"; break; fi
            sleep 2
          done
          docker logs agentic-test 2>&1 | tail -n 80
          [ "$ok" = 1 ]
          curl -fsS -o /dev/null -w "web app: %{http_code}\n" http://127.0.0.1:8080/

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Agentic
            org.opencontainers.image.description=Agentic: a multi-agent AI server with a web app, API and MCP tools
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha
