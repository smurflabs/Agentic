<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <title>Shared chat · Agentic</title>
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/vendor/katex/katex.min.js" defer></script>
  <script src="/assets/js/share.js" defer></script>
  <script src="/assets/js/markdown.js" defer></script>
</head>
<body class="share-page">
  <header class="share-top">
    <a href="/" aria-label="Agentic"><img src="/assets/img/logo.png" alt="Agentic" width="604" height="160"></a>
    <span class="spacer"></span>
    <span class="badge outline">Shared conversation · read-only</span>
  </header>
  <main class="share-main">
    <div class="share-head" id="share-head"><div class="muted">Loading…</div></div>
    <div class="chat-thread share-thread" id="share-thread"></div>
  </main>
  <footer class="share-foot muted small">Shared from Agentic. Answers may be written by AI models: check important information.</footer>
</body>
</html>
